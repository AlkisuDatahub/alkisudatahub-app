name: 1. Generate Release Keystore (run this once)

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias (a short name, e.g. alkisu)'
        required: true
        default: 'alkisu'
      store_password:
        description: 'Keystore password (remember this — you will need it again)'
        required: true
      key_password:
        description: 'Key password (can be the same as the keystore password)'
        required: true
      full_name:
        description: 'Your name or company name'
        required: true
        default: 'Aliyu'
      org:
        description: 'Organization name'
        required: true
        default: 'Geraldimer ICT'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.store_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=${{ github.event.inputs.full_name }}, OU=AlkisuDataHub, O=${{ github.event.inputs.org }}, L=Sokoto, C=NG"
          base64 -w 0 release.keystore > release.keystore.base64.txt
          echo "Keystore generated. Download the artifact below — you need release.keystore.base64.txt for the next step."

      - name: Upload keystore (download this and keep it safe!)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-KEEP-SAFE
          path: |
            release.keystore
            release.keystore.base64.txt
